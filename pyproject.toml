[build-system]
requires = ["setuptools==84.1.0", "setuptools-scm==10.3.4", "wheel==0.48.0", "auditwheel==6.7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright"
description = "A high-level API to automate web browsers"
authors = [
    {name = "Microsoft Corporation"}
]
readme = "README.md"
license = "Apache-2.0"
dynamic = ["version"]
requires-python = ">=3.10"
# Please when changing dependencies run the following commands to update requirements.txt:
# - pip install uv==0.5.4
# - uv pip compile pyproject.toml -o requirements.txt
dependencies = [
    "pyee>=13,<15",
    "greenlet>=3.1.1,<4.0.0"
]
classifiers = [
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
homepage = "https://github.com/Microsoft/playwright-python"
"Release notes" = "https://github.com/microsoft/playwright-python/releases"

[project.scripts]
playwright = "playwright.__main__:main"

[project.entry-points.pyinstaller40]
hook-dirs = "playwright._impl.__pyinstaller:get_hook_dirs"

[tool.setuptools]
packages = [
    "playwright",
    "playwright.async_api",
    "playwright.sync_api",
    "playwright._impl",
    "playwright._impl.__pyinstaller",
    "playwright._impl.isomorphic",
    "playwright._impl.protocol",
    "playwright._impl.utils",
]
include-package-data = true

[tool.setuptools.exclude-package-data]
# The rules of the port, for the people who write it; not for the wheel.
"playwright._impl" = ["AGENTS.md"]

[tool.setuptools_scm]
version_file = "playwright/_repo_version.py"

[tool.pytest.ini_options]
addopts = "-Wall -rsx -vv -s"
# The timeout of a test is 30 seconds, as upstream; a test marked slow gets three
# times that, as test.slow() gives upstream (tests/conftest.py). The fixtures count,
# as upstream counts them. The thread method ends the process of a test that hangs,
# after tests/conftest.py has written its stacks to the standard error; xdist
# replaces the worker. The signal method can not be used: it raises inside the
# running code, and asyncio's Handle._run() catches and logs every BaseException but
# SystemExit and KeyboardInterrupt, so a timeout that fires while the event loop runs
# a callback is lost and the test hangs on.
timeout = 30
timeout_method = "thread"
markers = [
    "skip_browser",
    "only_browser",
    "skip_platform",
    "only_platform",
    "skip_protocol_check",
    "slow: the test gets three times the timeout, as test.slow() upstream",
]
filterwarnings = [
    # Twisted 26 passes pyOpenSSL objects to pyOpenSSL 26, which wants cryptography
    # objects: Twisted's to fix, not visible to this code.
    "ignore:Passing pyOpenSSL .* objects is deprecated:DeprecationWarning:OpenSSL.SSL",
    # txaio (the web socket server of the tests) calls asyncio.iscoroutinefunction(),
    # deprecated in Python 3.14, in its latest version too.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:txaio.tx",
]
junit_family = "xunit2"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
warn_unused_ignores = false
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = false
exclude = [
    "build/",
    "env/",
]

[tool.isort]
profile = "black"

[tool.pyright]
include = ["playwright", "tests", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "./build"]
pythonVersion = "3.10"
reportMissingImports = false
reportTypedDictNotRequiredAccess = false
reportCallInDefaultInitializer = true
reportOptionalSubscript = false
reportUnboundVariable = false
strictParameterNoneValue = false
reportIncompatibleVariableOverride = false
